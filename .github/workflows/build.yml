name: Stock watchapp
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install native SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0
          python -m pip install pebble-tool==5.0.40
          pebble sdk install 4.33.1
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: inspect-emery
          path: artifacts/pebble-inspect-*.pbw*
